[package]
name = "lenso-marketplace-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
description = "Signed release identity and verification for the Lenso Plugin marketplace."

[workspace]

[features]
default = ["native"]
native = [
  "dep:rusqlite",
  "dep:lenso-plugin-bundle",
  "lenso-plugin-catalog/bundle-verification",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2.2"
hex = "0.4"
lenso-plugin-bundle = { version = "0.4.2", optional = true }
lenso-plugin-catalog = { git = "https://github.com/LioRael/lenso-cli.git", rev = "798d58b9aae2f90ed29e17285b0693d10cb8eabd", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
