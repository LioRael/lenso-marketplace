[package]
name = "lenso-marketplace-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
[workspace]
[dependencies]
lenso-marketplace-web-plugin = { path = "../web" }
lenso-marketplace-directory-plugin = { path = "../directory" }
lenso-capability-marketplace-directory = { path = "../directory/crates/lenso-capability-marketplace-directory" }
lenso-app-authoring = { package = "lenso-cli", version = "0.5.3", default-features = false }
lenso-app-plan = "0.4.1"
lenso-capability-http-endpoint = "0.3.1"
lenso-native-adapter = "0.3.14"
lenso-kernel = "0.3.6"
lenso-runner = "0.2.13"
lenso-web-ingress-plugin = "0.4.2"
tokio = { version = "1", features = ["macros", "rt", "signal"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
[dev-dependencies]
lenso-marketplace-catalog = { path = "../catalog" }
ed25519-dalek = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
