[workspace]
resolver = "2"
members = [
  "apps/native",
  "apps/workers",
  "apps/workers-sdk-prototype",
  "plugins/directory",
  "plugins/web",
  "contracts/directory",
  "contracts/linked-directory",
  "contracts/package-directory",
  "contracts/release-content-directory",
  "tools/publisher",
  "tests/support",
]
default-members = [
  "apps/native",
  "plugins/directory",
  "plugins/web",
  "contracts/directory",
  "tools/publisher",
  "tests/support",
]
exclude = ["tests/fixtures/echo", "tests/fixtures/proof"]

[workspace.dependencies]
lenso-plugin-catalog = { git = "https://github.com/LioRael/lenso.git", rev = "634afb0a03f9c0b34d9aba040338696849339146", default-features = false }
lenso-kernel = "=0.3.6"
lenso-app-plan = "=0.4.6"
lenso-native-adapter = "=0.3.14"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

[profile.release]
opt-level = "s"
lto = true
