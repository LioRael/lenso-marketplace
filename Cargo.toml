[workspace]
resolver = "2"
members = [
  "apps/native",
  "apps/workers",
  "plugins/directory",
  "plugins/web",
  "contracts/directory",
  "tools/publisher",
  "tests/support",
]
default-members = [
  "apps/native",
  "plugins/directory",
  "plugins/web",
  "contracts/directory",
  "tools/publisher",
  "tests/support",
]
exclude = ["tests/fixtures/echo", "tests/fixtures/proof"]

[workspace.dependencies]
lenso-plugin-catalog = { git = "https://github.com/LioRael/lenso-cli.git", rev = "78fc2b188eec19acd886c0c20457de7a2cccfc97", default-features = false }
lenso-kernel = "=0.3.6"
lenso-app-plan = "=0.4.1"
lenso-native-adapter = "=0.3.14"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

[profile.release]
opt-level = "s"
lto = true
