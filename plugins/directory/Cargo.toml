[package]
name = "lenso-marketplace-directory-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[package.metadata.lenso]
plugin-id = "lenso.marketplace.directory"
root-slot = "marketplace-directories"


[features]
default = ["native"]
package-publication = ["native"]
native = [
  "dep:rusqlite",
  "dep:flate2",
  "dep:tar",
  "dep:toml",
  "dep:base64",
  "dep:url",
  "lenso-plugin-catalog/bundle-verification",
]

[dependencies]
anyhow = "1"
futures = "0.3"
rusqlite = { version = "0.40", features = [
  "bundled",
  "backup",
], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
toml = { version = "0.9", optional = true }
lenso = "0.5.17"
lenso-kernel = "0.3.6"
lenso-plugin-catalog.workspace = true
lenso-native-adapter = "0.3.14"
lenso-capability-marketplace-directory = { path = "../../contracts/directory" }
lenso-capability-marketplace-linked-directory = { path = "../../contracts/linked-directory" }
lenso-capability-marketplace-package-directory = { path = "../../contracts/package-directory" }
lenso-capability-marketplace-release-content-directory = { path = "../../contracts/release-content-directory" }
serde_json = "1"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
base64 = { version = "0.22", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
ed25519-dalek = "2.2"

[lints.rust]
unsafe_code = "forbid"
