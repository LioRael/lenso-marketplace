[package]
name = "lenso-marketplace-web-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
[package.metadata.lenso]
plugin-id = "lenso.marketplace.web"
root-slot = "web"

[features]
default = ["native"]
native = ["dep:rusqlite"]

[dependencies]
anyhow = "1"
futures = "0.3"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
lenso = "0.5.17"
lenso-kernel = "0.3.6"
lenso-capability-http-endpoint = "0.3.1"
lenso-capability-marketplace-directory = { path = "../../contracts/directory" }
lenso-plugin-catalog.workspace = true
lenso-native-adapter = "0.3.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.2"
hex = "0.4"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
