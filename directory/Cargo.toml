[package]
name = "lenso-marketplace-directory-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[package.metadata.lenso]
plugin-id = "lenso.marketplace.directory"
root-slot = "marketplace-directories"

[workspace]
members = [".", "crates/lenso-capability-marketplace-directory"]

[dependencies]
lenso = "0.5.17"
lenso-kernel = "0.3.6"
lenso-marketplace-catalog = { path = "../catalog" }
lenso-capability-marketplace-directory = { path = "crates/lenso-capability-marketplace-directory" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
ed25519-dalek = "2.2"

[lints.rust]
unsafe_code = "forbid"

# Immutable development cohort; replace with published minimum versions before
# registry publication. Marketplace consumes verification, not Agent authority.
[patch.crates-io]
lenso-cli = { git = "https://github.com/LioRael/lenso-cli.git", rev = "3b1c3948d65f716b480fb11b45a52835c8ae8c39" }
lenso-plugin-bundle = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "a78f1f399825f152708ad091cf6196e5670383f5" }
