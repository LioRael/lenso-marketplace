[package]
name = "lenso-marketplace-directory-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[package.metadata.lenso]
plugin-id = "lenso.marketplace.directory"
root-slot = "marketplace-directories"

[workspace]
members = [".", "crates/lenso-capability-marketplace-directory"]

[features]
default = ["native"]
native = ["lenso-marketplace-catalog/native"]

[dependencies]
lenso = "0.5.17"
lenso-kernel = "0.3.6"
lenso-marketplace-catalog = { path = "../catalog", default-features = false }
lenso-native-adapter = "0.3.14"
lenso-capability-marketplace-directory = { path = "crates/lenso-capability-marketplace-directory" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
futures = "0.3"
tempfile = "3"
ed25519-dalek = "2.2"

[lints.rust]
unsafe_code = "forbid"
