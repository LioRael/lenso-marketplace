[package]
name = "lenso-marketplace-web-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
[package.metadata.lenso]
plugin-id = "lenso.marketplace.web"
root-slot = "web"
[workspace]
[features]
default = ["native"]
native = ["lenso-marketplace-catalog/native"]

[dependencies]
lenso = "0.5.17"
lenso-kernel = "0.3.6"
lenso-capability-http-endpoint = "0.3.1"
lenso-capability-marketplace-directory = { path = "../directory/crates/lenso-capability-marketplace-directory" }
lenso-marketplace-catalog = { path = "../catalog", default-features = false }
lenso-native-adapter = "0.3.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.2"
hex = "0.4"

[build-dependencies]
sha2 = "0.10"
