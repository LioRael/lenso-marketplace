name: Marketplace Workers
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  event-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install released Runtime package
        run: pnpm --dir workers install --frozen-lockfile
      - name: Build Marketplace assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check composed Wasm host
        run: cargo clippy --locked --manifest-path workers/Cargo.toml --target wasm32-unknown-unknown --workspace -- -D warnings
      - name: Check request-owned storage boundaries
        run: node --test workers/storage.test.mjs workers/storage-scope.test.mjs workers/operator/promote.test.mjs workers/operator/promote-runtime.test.mjs workers/operator/cloudflare.test.mjs
      - name: Build deployable Wasm artifact
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          bash workers/build.sh
          test -s workers/pkg/lenso_marketplace_workers_host_bg.wasm
          pnpm --dir workers exec wrangler deploy --dry-run
