name: Marketplace Workers
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  event-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy --locked -p lenso-marketplace-workers-host --target wasm32-unknown-unknown -- -D warnings
      - run: pnpm test:workers
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: CARGO=cargo pnpm build:workers
      - run: pnpm exec wrangler deploy --dry-run --config apps/workers/wrangler.jsonc
