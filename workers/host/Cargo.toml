[package]
name = "lenso-marketplace-workers-host"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
lenso-kernel.workspace = true
lenso-app-plan.workspace = true
lenso-native-adapter.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys = "=0.3.104"
futures = "0.3"
http = "1"
bytes = "1"
base64 = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lenso-marketplace-catalog = { path = "../../catalog", default-features = false }
lenso-marketplace-directory-plugin = { path = "../../directory", default-features = false }
lenso-marketplace-web-plugin = { path = "../../web", default-features = false }
lenso-capability-marketplace-directory = { path = "../../directory/crates/lenso-capability-marketplace-directory" }
lenso-capability-http-endpoint = "=0.3.1"
lenso-web-ingress-plugin = { path = "../../../../../../lenso-web/feat-workers-http-parity/crates/lenso-web-ingress-plugin", default-features = false }
