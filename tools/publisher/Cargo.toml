[package]
name = "lenso-marketplace-publisher"
version = "0.1.0"
edition = "2024"
default-run = "lenso-marketplace-publisher"
publish = false
[dependencies]
lenso-marketplace-directory-plugin = { path = "../../plugins/directory" }
lenso-plugin-catalog = { workspace = true, features = ["bundle-verification"] }
anyhow = "1"
ed25519-dalek = "2.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
lenso-app-authoring = { package = "lenso-cli", version = "0.5.3", default-features = false }

[[bin]]
name = "lenso-marketplace-author"
path = "src/author.rs"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
