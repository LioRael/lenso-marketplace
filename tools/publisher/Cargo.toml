[package]
name = "lenso-marketplace-publisher"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
lenso-marketplace-directory-plugin = { path = "../../plugins/directory" }
lenso-plugin-catalog = { workspace = true, features = ["bundle-verification"] }
anyhow = "1"
ed25519-dalek = "2.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
